name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Pull fixture corpus
        run: CLARICLE_CI_PAT_TOKEN=${{ secrets.CLARICLE_CI_PAT_TOKEN }} bundle exec rake fixtures:pull
        continue-on-error: true
      - name: Run tests
        run: bundle exec rake

  verapdf:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install veraPDF
        run: brew install verapdf
      - name: Pull fixture corpus
        run: CLARICLE_CI_PAT_TOKEN=${{ secrets.CLARICLE_CI_PAT_TOKEN }} bundle exec rake fixtures:pull
        continue-on-error: true
      - name: PDF/A cross-check
        run: bundle exec rake verapdf
