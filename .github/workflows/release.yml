name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (must already exist)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify the tag matches lib/pdfrb/version.rb
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          tag="${tag#refs/tags/}"
          tag="${tag#v}"
          version="$(ruby -Ilib -e 'require "pdfrb/version"; print Pdfrb::VERSION')"
          if [ "$tag" != "$version" ]; then
            echo "tag=$tag version=$version — mismatch"
            exit 1
          fi
          echo "Releasing $version"
      - name: Build gem
        run: bundle exec rake build
      - name: Configure RubyGems trusted publishing
        uses: rubygems/configure-rubygems-credentials@main
      - name: Publish to RubyGems
        run: gem push pkg/*.gem
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/*.gem
          generate_release_notes: true
          tag_name: ${{ inputs.tag || github.ref }}
