name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump-type:
        description: 'What to bump before tagging'
        type: choice
        options:
          - current
          - patch
          - minor
          - major
        default: patch

# contents: write is needed for workflow_dispatch to push the bump commit + tag.
# id-token: write is required for RubyGems.org Trusted Publishing (OIDC).
permissions:
  contents: write
  id-token: write

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      new-version: ${{ steps.bump.outputs.new-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'

      - name: Bump version.rb
        id: bump
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump-type }}
        run: |
          set -euo pipefail

          if [[ "$BUMP_TYPE" == "current" ]]; then
            NEW_VERSION=$(ruby -Ilib -rpdfrb/version -e 'puts Pdfrb::VERSION')
            echo "new-version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "Releasing current VERSION (${NEW_VERSION}) -- no bump."
            exit 0
          fi

          ruby <<'RUBY'
            bump_type = ENV.fetch("BUMP_TYPE")
            path = "lib/pdfrb/version.rb"
            content = File.read(path)

            current = content.match(/VERSION = "([^"]+)"/) or
              raise "Could not find VERSION in #{path}"
            segments = current[1].split(".").map(&:to_i)
            raise "Invalid version: #{current[1]}" unless segments.length == 3

            case bump_type
            when "patch" then segments[2] += 1
            when "minor" then segments[1] += 1; segments[2] = 0
            when "major" then segments[0] += 1; segments[1] = 0; segments[2] = 0
            else raise "Unknown bump-type: #{bump_type}"
            end

            new_version = segments.join(".")
            content.sub!(/VERSION = "[^"]+"/,
                         "VERSION = \"#{new_version}\"") or
              raise "Failed to substitute version"
            File.write(path, content)
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |f|
              f.puts "new-version=#{new_version}"
            end
            warn "Bumped to #{new_version}"
          RUBY

          NEW_VERSION=$(ruby -Ilib -rpdfrb/version -e 'puts Pdfrb::VERSION')
          echo "new-version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pdfrb/version.rb
          git commit -m "Release v${NEW_VERSION}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Show what's being released
        run: |
          echo "Releasing version: ${{ steps.bump.outputs.new-version }}"
          git --no-pager log --oneline -1 "${{ steps.bump.outputs.sha }}"

      - name: Push bump commit + tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
          SHA: ${{ steps.bump.outputs.sha }}
        run: |
          # Only push the bump commit if it exists (skipped for bump-type=current).
          if [[ -n "${SHA}" && "${SHA}" != "${{ github.sha }}" ]]; then
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
          git tag "v${NEW_VERSION}" "${SHA}"
          git push origin "v${NEW_VERSION}"

  build:
    needs: bump
    if: always() && !cancelled() && !failure() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: bundle exec rake build

      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: pkg/*.gem

  publish:
    needs: [ bump, build ]
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/download-artifact@v4
        with:
          name: pkg
          path: pkg

      - name: Configure RubyGems credentials (Trusted Publishing / OIDC)
        uses: rubygems/configure-rubygems-credentials@main

      - name: Publish to rubygems.org
        run: |
          for gem in pkg/*.gem; do gem push -V "$gem"; done
