inherit_from:
  - https://raw.githubusercontent.com/riboseinc/oss-guides/main/ci/rubocop.yml
  - .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-rspec
  - rubocop-performance
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "data/**/*"
    - "pkg/**/*"

# Project-specific: TSV files are data, not code; PDFs are binary.
# Both are excluded via AllCops above. Local overrides go here.

# Integration tests use string describes ("FOP-generated PDF reading")
# because they exercise multiple classes through a real workflow.
RSpec/DescribeClass:
  Enabled: false

# pdfrb uses compact module names (CMap not C_Map) that don't match
# the snake_case → CamelCase file-path convention.
RSpec/SpecFilePathFormat:
  Enabled: false
